<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carregando...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { overflow-x: hidden; word-break: break-word; overflow-wrap: anywhere; }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,0,0,0.22); }
      50% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(0,0,0,0); }
    }
    .cta-pulse { animation: pulseGlow 2.4s infinite; }
    header.compact { padding-top: 0.55rem; padding-bottom: 0.55rem; box-shadow: 0 6px 24px rgba(0,0,0,0.08); }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

  <div id="loading" class="fixed inset-0 flex flex-col items-center justify-center bg-slate-50 z-50">
    <div class="w-10 h-10 border-4 border-slate-300 border-t-slate-900 rounded-full animate-spin mb-3"></div>
    <p class="text-sm text-slate-600 font-medium">Carregando site...</p>
  </div>

  <header id="site-header" class="fixed top-0 left-0 right-0 z-40 bg-white/95 backdrop-blur border-b border-black/5 transition-all duration-300 py-3.5 px-4 sm:px-8 hidden">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <a href="#top" id="brand-link" class="flex items-center gap-3 min-w-0">
        <img id="header-logo" class="h-10 w-auto object-contain hidden" alt="Logo" />
        <span id="header-title" class="font-bold text-lg sm:text-xl truncate"></span>
      </a>
      <nav id="desktop-nav" class="hidden md:flex items-center gap-6 text-sm font-medium"></nav>
      <button id="menu-toggle" class="md:hidden p-2 rounded-lg border border-black/10" aria-label="Abrir menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
    <nav id="mobile-nav" class="hidden md:hidden flex-col gap-2 pt-3 pb-2 px-2 border-t border-black/5 mt-3"></nav>
  </header>

  <main id="top" class="flex-1 pt-20"></main>

  <footer id="site-footer" class="py-10 px-4 sm:px-8 mt-auto hidden">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-6 text-center sm:text-left">
      <div class="flex flex-col items-center sm:items-start gap-2">
        <img id="footer-logo" class="h-10 w-auto object-contain hidden" alt="Logo Rodapé" />
        <strong id="footer-title" class="text-lg"></strong>
        <p id="footer-address" class="text-sm opacity-80"></p>
      </div>
      <div class="flex flex-col items-center sm:items-end gap-2 text-sm">
        <div id="footer-socials" class="flex items-center gap-4"></div>
        <p id="footer-copy" class="opacity-75"></p>
      </div>
    </div>
  </footer>

  <a id="floating-wa" target="_blank" rel="noopener" class="hidden fixed bottom-5 right-5 z-40 flex items-center gap-2 px-4 py-3 rounded-full text-white font-semibold shadow-xl cta-pulse" style="background:#16A34A;">
    <span>WhatsApp</span>
  </a>

  <script>
    function gerarIlustracaoSVG(paleta, seedText = '') {
      const p = paleta.primaria || '#1E293B';
      const s = paleta.secundaria || '#E2E8F0';
      const d = paleta.destaque || '#2563EB';
      return `
        <svg viewBox="0 0 800 420" class="w-full h-full object-cover" xmlns="http://www.w3.org/2000/svg">
          <rect width="800" height="420" fill="${s}"/>
          <circle cx="660" cy="95" r="140" fill="${p}" opacity="0.14"/>
          <circle cx="150" cy="350" r="170" fill="${d}" opacity="0.18"/>
          <rect x="240" y="95" width="320" height="230" rx="28" fill="#ffffff" opacity="0.88"/>
          <circle cx="400" cy="185" r="46" fill="${p}" opacity="0.9"/>
          <rect x="305" y="252" width="190" height="16" rx="8" fill="${d}" opacity="0.85"/>
          <rect x="340" y="280" width="120" height="12" rx="6" fill="${p}" opacity="0.35"/>
        </svg>`;
    }

    function buildWaLink(num, msg) {
      const clean = String(num || '').replace(/\D/g, '');
      if (!clean) return '#';
      const full = clean.length <= 11 ? '55' + clean : clean;
      return `https://wa.me/${full}?text=${encodeURIComponent(msg || 'Olá! Vim pelo site e gostaria de mais informações.')}`;
    }

    function renderMedia(obj, paleta, heightClass) {
      if (obj.usarImagem === false) return '';
      const hasUpload = obj.fonteImagem === 'upload' && (obj.imagemUpload || obj.imagem);
      const customImg = obj.imagemUpload || obj.imagem;
      if (hasUpload || (obj.fonteImagem !== 'padrao' && customImg)) {
        return `<div class="w-full ${heightClass} rounded-2xl overflow-hidden mb-5 bg-black/5">
          <img src="${customImg}" alt="${obj.titulo || ''}" class="w-full h-full object-cover" />
        </div>`;
      }
      return `<div class="w-full ${heightClass} rounded-2xl overflow-hidden mb-5">${gerarIlustracaoSVG(paleta, obj.titulo)}</div>`;
    }

    async function initSite() {
      const pathSlug = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0];
      const querySlug = new URLSearchParams(window.location.search).get('site');
      const slug = querySlug || pathSlug || '';
      const apiUrl = slug
        ? `/api/config?site=${encodeURIComponent(slug)}`
        : `/api/config?domain=${encodeURIComponent(window.location.hostname)}`;

      try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        if (!res.ok || !data.ok || !data.config) {
          throw new Error(data.error || 'Site não encontrado.');
        }

        const cfg = data.config;
        const pal = cfg.paleta || { primaria: '#1E293B', secundaria: '#E2E8F0', fundo: '#F8FAFC', destaque: '#2563EB', texto: '#0F172A' };

        document.title = cfg.titulo || 'Site Oficial';
        document.body.style.backgroundColor = pal.fundo;
        document.body.style.color = pal.texto;

        // Cabeçalho
        const header = document.getElementById('site-header');
        header.classList.remove('hidden');
        document.getElementById('header-title').textContent = cfg.titulo || '';
        document.getElementById('header-title').style.color = pal.primaria;
        if (cfg.logoClara) {
          const img = document.getElementById('header-logo');
          img.src = cfg.logoClara;
          img.classList.remove('hidden');
        }

        const secoes = Array.isArray(cfg.secoes) ? cfg.secoes : [];
        const navLinks = secoes
          .filter(s => s.menu)
          .map(s => `<a href="#sec-${s.id}" class="hover:opacity-75 transition" style="color:${pal.primaria}">${s.menu}</a>`)
          .join('');
        document.getElementById('desktop-nav').innerHTML = navLinks;
        document.getElementById('mobile-nav').innerHTML = navLinks;

        document.getElementById('menu-toggle').onclick = () => {
          const m = document.getElementById('mobile-nav');
          m.classList.toggle('hidden');
          m.classList.toggle('flex');
        };
        document.querySelectorAll('#mobile-nav a').forEach(a => {
          a.onclick = () => {
            document.getElementById('mobile-nav').classList.add('hidden');
            document.getElementById('mobile-nav').classList.remove('flex');
          };
        });

        window.addEventListener('scroll', () => {
          header.classList.toggle('compact', window.scrollY > 30);
        });

        // Seções
        const main = document.getElementById('top');
        main.innerHTML = secoes.map(sec => {
          if (sec.tipo === 'hero') {
            return `
              <section id="sec-${sec.id}" class="py-8 sm:py-14 px-4 sm:px-8">
                <div class="max-w-5xl mx-auto rounded-3xl p-6 sm:p-10 shadow-sm text-center" style="background:${pal.secundaria}">
                  ${renderMedia(sec, pal, 'h-52 sm:h-80')}
                  <h1 class="text-2xl sm:text-4xl md:text-5xl font-extrabold leading-tight mb-4" style="color:${pal.primaria}">${sec.titulo || ''}</h1>
                  <p class="text-base sm:text-lg max-w-2xl mx-auto opacity-90 mb-7">${sec.descricao || ''}</p>
                  ${sec.textoBotao ? `
                    <a href="${buildWaLink(cfg.whatsapp, 'Olá! Gostaria de falar sobre: ' + (sec.titulo || cfg.titulo))}" target="_blank" rel="noopener"
                      class="inline-flex items-center justify-center px-7 py-3.5 rounded-full font-bold text-white shadow-lg cta-pulse"
                      style="background:${pal.destaque}">
                      ${sec.textoBotao}
                    </a>` : ''}
                </div>
              </section>`;
          }

          if (sec.tipo === 'cards' || Array.isArray(sec.itens)) {
            const itens = sec.itens || [];
            const cols = itens.length === 1 ? 'max-w-xl mx-auto grid-cols-1'
              : itens.length === 2 || itens.length === 4 ? 'grid-cols-1 md:grid-cols-2'
              : 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3';

            return `
              <section id="sec-${sec.id}" class="py-12 px-4 sm:px-8">
                <div class="max-w-6xl mx-auto">
                  <div class="text-center max-w-2xl mx-auto mb-10">
                    <h2 class="text-2xl sm:text-3xl font-bold mb-2" style="color:${pal.primaria}">${sec.titulo || ''}</h2>
                    ${sec.subtitulo ? `<p class="opacity-80">${sec.subtitulo}</p>` : ''}
                  </div>
                  <div class="grid ${cols} gap-6">
                    ${itens.map(item => `
                      <div class="rounded-2xl p-6 bg-white shadow-sm border border-black/5 flex flex-col justify-between">
                        <div>
                          ${renderMedia(item, pal, 'h-44')}
                          <h3 class="text-xl font-bold mb-2" style="color:${pal.primaria}">${item.titulo || ''}</h3>
                          <p class="text-sm opacity-85 leading-relaxed mb-5">${item.descricao || ''}</p>
                        </div>
                        ${item.textoBotao ? `
                          <a href="${buildWaLink(cfg.whatsapp, 'Olá! Tenho interesse em: ' + (item.titulo || ''))}" target="_blank" rel="noopener"
                            class="w-full text-center py-2.5 px-4 rounded-xl font-semibold text-white transition hover:opacity-90"
                            style="background:${pal.destaque}">
                            ${item.textoBotao}
                          </a>` : ''}
                      </div>`).join('')}
                  </div>
                </div>
              </section>`;
          }

          return `
            <section id="sec-${sec.id}" class="py-12 px-4 sm:px-8">
              <div class="max-w-5xl mx-auto rounded-3xl p-6 sm:p-10 bg-white shadow-sm border border-black/5">
                ${renderMedia(sec, pal, 'h-56 sm:h-72')}
                <h2 class="text-2xl sm:text-3xl font-bold mb-4" style="color:${pal.primaria}">${sec.titulo || ''}</h2>
                <p class="text-base leading-relaxed opacity-90 whitespace-pre-line">${sec.descricao || ''}</p>
              </div>
            </section>`;
        }).join('');

        // Rodapé
        const footer = document.getElementById('site-footer');
        footer.classList.remove('hidden');
        footer.style.backgroundColor = pal.primaria;
        footer.style.color = '#ffffff';
        document.getElementById('footer-title').textContent = cfg.titulo || '';
        document.getElementById('footer-address').textContent = cfg.rodape?.endereco || '';
        document.getElementById('footer-copy').textContent = cfg.rodape?.copyright || `© ${new Date().getFullYear()} ${cfg.titulo || ''}`;
        if (cfg.logoEscura) {
          const fl = document.getElementById('footer-logo');
          fl.src = cfg.logoEscura;
          fl.classList.remove('hidden');
        }
        const socials = [];
        if (cfg.instagram) {
          const ig = cfg.instagram.replace(/^@/, '');
          socials.push(`<a href="https://instagram.com/${ig}" target="_blank" rel="noopener" class="underline">Instagram</a>`);
        }
        if (cfg.whatsapp) {
          socials.push(`<a href="${buildWaLink(cfg.whatsapp)}" target="_blank" rel="noopener" class="underline">WhatsApp</a>`);
          const fwa = document.getElementById('floating-wa');
          fwa.href = buildWaLink(cfg.whatsapp);
          fwa.classList.remove('hidden');
        }
        document.getElementById('footer-socials').innerHTML = socials.join('');

        document.getElementById('loading').classList.add('hidden');
      } catch (err) {
        document.getElementById('loading').innerHTML = `
          <div class="text-center px-6 max-w-md">
            <h1 class="text-xl font-bold text-slate-800 mb-2">Site em preparação</h1>
            <p class="text-sm text-slate-500">${err.message}</p>
          </div>`;
      }
    }

    initSite();
  </script>
</body>
</html>
